# Render Blueprint — free plan, no credit card required
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance
services:
  - type: web
    name: crm-hammer
    runtime: node
    plan: free
    region: frankfurt
    # --ignore-scripts: better-sqlite3 v13 ships N-API prebuilds, so no native
    # compilation is needed (npm ci would otherwise try node-gyp).
    buildCommand: npm ci --ignore-scripts && npm run build
    startCommand: npm run start:cloud
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: CRM_DB_PATH
        value: /tmp/crm.db
      - key: SHEET_RESTORE_ON_BOOT
        value: "1"
      # The rest come from the .env file pasted in the dashboard (see RENDER-GUIDE.md)
